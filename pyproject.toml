[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-catalog-etl"
version = "0.1.0"
description = "Sanitized demo ETL pipeline for media catalog metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "aiosqlite",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
media-catalog-etl = "media_catalog_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
